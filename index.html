
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Mateo Portfolio</title>
</head>
<body>
<!-- Header -->
<div id="header">
    <h1 id="page-title"></h1>
    <div class="dropdown">
        <button class="language" id="language-btn">EN</button>
        <div class="dropdown-content">
            <a href="#" onclick="setLanguage('en')">EN</a>
            <a href="#" onclick="setLanguage('es')">ES</a>
        </div>
    </div>
</div>

<!-- Presentation Section -->
<section id="presentation">
    <img src="assets/images/Photo.png" alt="Your Photo" width="150" height="150">
    <h2 id="name"></h2>
    <p id="student"></p>
    <p id="university"></p>
    <p id="degree"></p>

    <p><a href="https://github.com/matrodriguezpa">GitHub</a></p>
    <p><a href="assets/HV_Mateo_Rodríguez_Palacios.pdf">CV</a></p>
</section>

<!-- Personal Section -->
<section id="about-me">
    <h1 id="about-me"></h1>
    <p id="personal-description"></p>
</section>

<!-- Projects Section -->
<section id="projects">
    <h1 id="projects-title"></h1>
    <div id="tag-filters"></div>
    <ul id="projects-list"></ul>
</section>

<script>
    // Load data.json and initialize
    fetch('data.json')
        .then(response => response.json())
        .then(data => initPortfolio(data));
</script>
</body>
</html>
