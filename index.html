
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title & Description -->
    <title>Mateo Portfolio</title>
    <meta name="description" content="Explore Mateo's portfolio showcasing creative frontend development, UI/UX design, and web projects.">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/images/favicon.png" type="image/x-icon" />

    <!-- Styles & Scripts -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- Open Graph (only the basics for LinkedIn preview) -->
    <meta property="og:title" content="Mateo Portfolio | Frontend Developer & Designer">
    <meta property="og:description" content="Explore Mateo's portfolio showcasing frontend development and design projects.">
    <meta property="og:image" content="https://matrodriguezpa.github.io/portfolio/assets/images/Photo.png">
    <meta property="og:url" content="https://matrodriguezpa.github.io/portfolio/">
    <meta property="og:type" content="website">
</head>

<body>
<!-- Header -->
<div id="header">
    <h1 id="page-title"></h1>
    <div class="dropdown">
        <button class="language" id="language-btn">EN</button>
        <div class="dropdown-content">
            <a href="#" onclick="setLanguage('en')">EN</a>
            <a href="#" onclick="setLanguage('es')">ES</a>
        </div>
    </div>
</div>

<!-- Presentation Section -->
<section id="presentation" class="block">
    <img src="assets/images/Photo.png" alt="Your Photo" width="150" height="150">
    <h1 id="name"></h1>
    <p id="student"></p>
    <p id="university"></p>
    <p id="degree"></p>

    <p><a href="https://github.com/matrodriguezpa">GitHub</a></p>
    <p><a href="assets/CV_MATEO_RODRIGUEZ_PALACIOS.pdf">CV</a></p>
</section>

<!-- Personal Section -->
<section id="about" class="block">
    <h1 id="about-me"></h1>
    <p id="personal-description"></p>
</section>

<!-- Projects Section -->
<section id="projects" class="block">
    <h1 id="projects-title"></h1>
    <div id="tag-filters"></div>
    <ul id="projects-list"></ul>
</section>
</body>
</html>
